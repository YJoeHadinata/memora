[package]
name = "memora"
version = "0.2.0"
edition = "2021"
authors = ["Y. Joe Hadinata <https://github.com/YJoeHadinata>"]
description = "Native macOS memory telemetry, process energy monitor, storage optimizer, and menu bar companion."
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/YJoeHadinata/memora"
repository = "https://github.com/YJoeHadinata/memora"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "system_fonts", "glow", "clipboard", "links"] }
egui = "0.37.0"
egui_plot = "0.38.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
